      .caption { font-size: 12px; }
      .tile { fill: #26353d; stroke: #8ea3a5; stroke-width: 1.5; rx: 6; }
      .active { fill: #204d65; stroke: #63c6ee; stroke-width: 2; }
      .hardware { fill: #283b37; stroke: #8bc6a6; stroke-width: 1.5; }
      .edge { fill: #11191d; fill-opacity: .94; }
    </style>
    <g id="xo">
      <circle cx="0" cy="-10" r="5" fill="#6ae4c4"/>
      <path d="M-10 0L0 6 10 0M0 6v11M0 17l-8 10M0 17l8 10" fill="none" stroke="#f6f8f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
