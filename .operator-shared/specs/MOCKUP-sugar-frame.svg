<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Propuesta del Frame Sugar compuesto por bloques en 800 por 600 píxeles">
  <defs>
    <linearGradient id="wall" x2="1" y2="1">
      <stop stop-color="#222e36"/>
      <stop offset="1" stop-color="#17232b"/>
