name: release

# Compila el motor (fork de Godot 3.6 + platform/frt + módulo ImGui) junto con este
# repo y publica el tarball que consume install.sh:
#   gdtk-<version>-linux-x86_64.tar.gz (+ .sha256)
#
# Fuentes (todas públicas; override opcional con Repository variables GDTK_*):
#   motor:  icarito/godot          @ gdtk-release   (aaf46b8772 + fix de brightness/rich_text)
#   frt:    icarito/godot-frt      @ main           (capa de plataforma, se copia a platform/frt)
#   imgui:  icarito/godot-box3d-3  @ eddf969        (módulo ImGui con el parche gdtk)
#
# Se compila dentro de un contenedor Arch porque el binario enlaza wlroots 0.20,
# libei y sdl2, que en las runners de Ubuntu no están a esa versión.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (sin la v; default: del tag o fecha+sha)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencias de build (Arch)
        run: |
          pacman -Syu --noconfirm --needed base-devel git python scons pkgconf rsync binutils \
            wlroots0.20 wayland wayland-protocols libxkbcommon libei systemd-libs sdl2-compat \
            mesa libglvnd vulkan-icd-loader pixman libdrm libffi expat glib2 dbus \
            libxcb xcb-util xcb-util-wm xcb-util-errors xcb-util-renderutil libxau libxdmcp \
            lcms2 libgudev libinput libevdev mtdev libwacom seatd lua54

      - uses: actions/checkout@v4
        with:
          path: gdtk

      - name: Checkout del motor
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GDTK_ENGINE_REPO || 'icarito/godot' }}
          ref: ${{ vars.GDTK_ENGINE_REF || 'gdtk-release' }}
          path: engine

      - name: Checkout del módulo ImGui
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GDTK_IMGUI_REPO || 'icarito/godot-box3d-3' }}
          ref: ${{ vars.GDTK_IMGUI_REF || 'eddf96906e80ebcb83cd0c5a8d81f879e9c1122c' }}
          path: imgui

      - name: Checkout de platform/frt
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GDTK_FRT_REPO || 'icarito/godot-frt' }}
          ref: ${{ vars.GDTK_FRT_REF || 'main' }}
          path: frt

      - name: Copiar frt dentro del motor
        run: |
          mkdir -p engine/platform/frt
          cp -a frt/. engine/platform/frt/
          rm -rf engine/platform/frt/.git
          ls engine/platform/frt/detect.py

      - name: Compilar el motor + shell
        env:
          SCONS_CACHE: /tmp/scons-cache
          SCONS_CACHE_LIMIT: '30000'
        run: |
          cd engine
          scons -j"$(nproc)" platform=frt arch=x86_64 target=release_debug tools=no \
            frt_desktop_gl=yes production=yes lto=none use_static_cpp=no progress=no \
            extra_suffix=gdtklite imgui_implot3d=yes \
            custom_modules="$GITHUB_WORKSPACE/imgui,$GITHUB_WORKSPACE/gdtk/modules" \
            $(for m in bullet csg gridmap enet upnp webrtc websocket webxr mobile_vr gdnative \
                visual_script theora webm vorbis opus ogg stb_vorbis minimp3 gltf jsonrpc camera \
                opensimplex raycast box3d decal; do printf 'module_%s_enabled=no ' "$m"; done)

      - name: Empaquetar
        id: pack
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +%Y.%m.%d)-$(git -C gdtk rev-parse --short HEAD)"
          fi
          GDTK_NO_BUILD=1 GDTK_BIN="$GITHUB_WORKSPACE/engine/bin/godot.frt.opt.debug.x86_64.gdtklite" \
            GDTK_DIST="$GITHUB_WORKSPACE/dist" gdtk/tools/make-release.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gdtk-linux-x86_64
          path: dist/*.tar.gz*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true
