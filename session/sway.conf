# Sólo el shell gdtk a pantalla completa (ver gdtk-session-sway): sin barra, bordes ni atajos
# propios, así Super y el resto de las teclas llegan al shell.
default_border none
default_floating_border none
# Touchpad: tap para click y scroll natural activo por defecto (Configuración ->
# Desplazamiento lo cambia; session/input-settings.sh lo reaplica al iniciar).
input type:touchpad {
	tap enabled
	natural_scroll enabled
}
# Mouse/TrackPoint: el scroll natural no es sólo del panel táctil, también aplica a
# la rueda. Mismo ajuste en vivo y al iniciar.
input type:pointer {
	natural_scroll enabled
}
# gdtk levanta su propio Xwayland bajo demanda para las apps X11.
xwayland disable
# Sin swaybg (no instalado): el shell tapa toda la pantalla.
swaybg_command -
for_window [title=".*"] fullscreen enable
# Ajustes de entrada del usuario (dirección del scroll del touchpad); corre después
# de aplicar esta config, cuando swaymsg ya responde.
exec sh -c '"$GDTK_HOME/session/input-settings.sh"'
# Rotación: la maneja el shell (session/gdtk-rotate auto) para funcionar también en
# X11; la tecla rota 90°.
bindsym --locked XF86RotateWindows exec sh -c '"$GDTK_HOME/session/gdtk-rotate" next'
# Al salir del shell (Salir) termina la sesión.
exec sh -c '"$GDTK_HOME/session/gdtk-supervisor" "$GDTK_GODOT" ${GDTK_VIDEO_DRIVER:+--video-driver "$GDTK_VIDEO_DRIVER"} --fullscreen --path "$GDTK_HOME/shell"; swaymsg exit'
