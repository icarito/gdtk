# Sólo el shell gdtk a pantalla completa (ver gdtk-session-sway): sin barra, bordes ni atajos
# propios, así Super y el resto de las teclas llegan al shell.
default_border none
default_floating_border none
# Touchpad: tap para click y scroll natural activo por defecto (Configuración ->
# Desplazamiento lo cambia; session/input-settings.sh lo reaplica al iniciar).
input type:touchpad {
	tap enabled
	natural_scroll enabled
}
# Mouse/TrackPoint: el scroll natural no es sólo del panel táctil, también aplica a
# la rueda. Mismo ajuste en vivo y al iniciar.
input type:pointer {
	natural_scroll enabled
}
# gdtk levanta su propio Xwayland bajo demanda para las apps X11.
xwayland disable
# Sin swaybg (no instalado): el shell tapa toda la pantalla.
swaybg_command -
for_window [title=".*"] fullscreen enable
# Ajustes de entrada del usuario (dirección del scroll del touchpad); corre después
# de aplicar esta config, cuando swaymsg ya responde.
exec sh -c '"$GDTK_HOME/session/input-settings.sh"'
# El portal ScreenCast (xdg-desktop-portal-wlr, compartir pantalla en Meet/Zoom) tiene
# que ver el socket de ESTE sway (donde vive el shell fullscreen), no el compositor
# anidado de gdtk ni un WAYLAND_DISPLAY viejo del gestor de systemd. Se publica el
# entorno real para servicios activados por D-Bus/systemd y se deja el socket de sway en
# gdtk-sway-env (el drop-in de systemd de xdpw lo lee con EnvironmentFile; ver portal.sh).
exec sh -c 'printf "WAYLAND_DISPLAY=%s\n" "$WAYLAND_DISPLAY" > "${XDG_RUNTIME_DIR:-/tmp}/gdtk-sway-env" 2>/dev/null; command -v dbus-update-activation-environment >/dev/null 2>&1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP; command -v systemctl >/dev/null 2>&1 && systemctl --user import-environment WAYLAND_DISPLAY 2>/dev/null; true'
# Rotación: la maneja el shell (session/gdtk-rotate auto) para funcionar también en
# X11; la tecla rota 90°.
bindsym --locked XF86RotateWindows exec sh -c '"$GDTK_HOME/session/gdtk-rotate" next; "$GDTK_HOME/session/gdtk-rotate" hold on'
# Brillo: sdl2-compat (SDL3) ya no tiene los scancodes de brillo, así que las teclas
# XF86MonBrightness* no llegan al shell (llegan como scancode 0). sway ve el keysym
# XKB y las reenvía por el RPC del shell (session/gdtk-media), que ajusta el brillo y
# muestra el OSD; sin shell escuchando cae al ajuste directo por logind.
bindsym --locked XF86MonBrightnessUp exec sh -c '"$GDTK_HOME/session/gdtk-media" brightness-up'
bindsym --locked XF86MonBrightnessDown exec sh -c '"$GDTK_HOME/session/gdtk-media" brightness-down'
# Swipe de 3 dedos: sin bindgesture, sway lo reenvía al shell (zwp_pointer_gestures_v1)
# y el motor lo entrega continuo como InputEventPanGesture. session/gdtk-gesture queda
# para RPC/pruebas (left/right/up/down).
# Pinch de dos dedos: cada gesto es un paso de zoom para el cliente con foco, vía
# el protocolo zwp_pointer_gesture_pinch_v1 que ahora expone el compositor embebido
# (módulo wayland). Seats que captura el gesto; el cliente no lo recibe por sway.
bindgesture pinch:2:outward exec sh -c '"$GDTK_HOME/session/gdtk-gesture" pinch-out'
bindgesture pinch:2:inward exec sh -c '"$GDTK_HOME/session/gdtk-gesture" pinch-in'
# Salida de emergencia de Deskflow: si el puntero queda atrapado en un equipo remoto
# (cliente colgado), Ctrl+Alt+Escape mata deskflow-core. Lo atiende sway, así que
# funciona aunque el shell esté trabado o capturando; el shell lo relanza solo.
bindsym --locked Ctrl+Mod1+Escape exec sh -c 'pkill -u "$(id -u)" -x deskflow-core'
# Con varias pantallas, gdtk-outputs elige dónde va el shell (externa > interna).
# Al salir del shell (Salir) termina la sesión.
exec sh -c '"$GDTK_HOME/session/gdtk-outputs"; "$GDTK_HOME/session/gdtk-supervisor" "$GDTK_GODOT" ${GDTK_VIDEO_DRIVER:+--video-driver "$GDTK_VIDEO_DRIVER"} --fullscreen --path "$GDTK_HOME/shell"; swaymsg exit'
