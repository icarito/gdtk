# Portales de la sesión gdtk (XDG_CURRENT_DESKTOP=gdtk): lo general, gtk; el input remoto
# (Deskflow, lan-mouse) y su captura de pantalla lo atiende el propio shell
# (RemoteInput, ver modules/wayland/eis_server.c). El ScreenCast (compartir pantalla en
# Meet/Zoom) y el Screenshot de apps usan el backend wlroots (xdg-desktop-portal-wlr,
# xdpw): es el que habla wlr-screencopy / ext-image-copy-capture con sway.
#
# El shell corre fullscreen sobre sway, así que la salida que captura xdpw es todo el
# escritorio gdtk. El selector de archivos (FileChooser) reutiliza el de GTK
# (xdg-desktop-portal-gtk), no se reinventa: el shell lo flota sobre su app host gracias
# a xdg-foreign (modules/wayland).
#
# El socket de sway se publica a los servicios del portal desde session/sway.conf
# (dbus-update-activation-environment), si no xdpw vería el compositor anidado de gdtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.RemoteDesktop=gdtk
org.freedesktop.impl.portal.InputCapture=gdtk
# ScreenCast: fuente nativa del shell (nodo PipeWire Video/Source que alimenta el
# multiview; SPEC-multiview-portal §9 N1). Requiere el motor recompilado con
# modules/wayland (libpipewire). Para volver al backend wlroots (xdpw) ante un
# problema: poner `wlr` acá y reiniciar xdg-desktop-portal + el shell.
org.freedesktop.impl.portal.ScreenCast=gdtk
org.freedesktop.impl.portal.Screenshot=wlr
