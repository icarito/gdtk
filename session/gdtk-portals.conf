# Portales de la sesión gdtk (XDG_CURRENT_DESKTOP=gdtk): lo general, gtk; el input remoto
# (Deskflow, lan-mouse) lo atiende el propio shell (RemoteInput, ver modules/wayland/eis_server.c).
# ScreenCast=gdtk es un backend vacío (sin fuentes): libportal lo exige para RemoteDesktop.
# El selector de archivos (FileChooser) reutiliza el de GTK (xdg-desktop-portal-gtk), no se
# reinventa: el shell lo flota sobre su app host gracias a xdg-foreign (modules/wayland).
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.RemoteDesktop=gdtk
org.freedesktop.impl.portal.ScreenCast=gdtk
org.freedesktop.impl.portal.InputCapture=gdtk
